openapi: 3.1.0
info:
  title: ERP Logistic API
  version: 0.2.0
  summary: Last-mile delivery ERP for Lima Metropolitana and Callao
  description: |
    JWT authentication, organization-scoped catalogs and orders, and manual
    route planning with audited order assignment.

    **Authentication.** Every `/api/v1` business route requires
    `Authorization: Bearer <access JWT>`. The token is HS256-only and carries
    `sub`, `organizationId`, `role`, `jti`, `iat`, `nbf`, `exp`, `iss` and
    `aud`. The API verifies all of them, then reloads the user and role from
    storage, so a deleted, disabled or demoted account takes effect on the next
    request. `POST /api/v1/auth/login` returns the access token in the body and
    the rotating refresh token in an `HttpOnly` + `SameSite=Strict` cookie
    (`Secure` is environment-driven). The cookie is scoped to `/api/v1/auth`
    and is never readable by JavaScript.

    **Tenant context.** The organization comes only from the verified token.
    The Phase 0 `x-organization-id` header no longer exists; a caller cannot
    claim another tenant.

    **Timestamps.** `createdAt` and `updatedAt` are ISO-8601 instants (UTC `Z`
    on the wire, `timestamptz` in PostgreSQL). The ratified convention is
    America/Lima: clients and logs render the same instant at `-05:00`. Lima
    has no daylight saving time.

    **Correlation.** Every response carries `x-request-id`. A safe incoming
    value is honored; otherwise the API generates a UUIDv4. The same value
    appears as `correlationId` in error bodies.

    **Errors.** Non-2xx API responses use one envelope:
    `{ "error": { "code", "message", "details?", "correlationId" } }`. Health
    readiness (`/readyz`) is the documented exception: it returns a status
    document because it reports a dependency state, not a client error.
servers:
  - url: http://localhost:3000
    description: Local development (Docker Compose or `npx tsx src/main.ts`)
tags:
  - name: auth
    description: Login, refresh rotation, logout and the current caller
  - name: users
    description: ADMIN-only user provisioning
  - name: delivery-orders
    description: Create, list, edit, cancel and audit delivery orders inside one organization
  - name: delivery-routes
    description: Manual route planning with ordered stops and tenant-bound order assignment
  - name: customers
    description: Customer catalog inside one organization
  - name: drivers
    description: Driver catalog inside one organization
  - name: vehicles
    description: Fleet catalog inside one organization
  - name: health
    description: Liveness and readiness probes
  - name: tracking
    description: Authenticated live delivery tracking
  - name: dashboard
    description: Organization-scoped dispatch dashboard
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Returns 200 while the process can serve HTTP. The container healthcheck
        uses this endpoint. It never depends on the database.
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessStatus'
  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Runs the injected readiness probe (a `SELECT 1` against PostgreSQL) and
        reports 503 while the dependency is unavailable. The API starts before the
        database is reachable and retries lazily, so a 503 can recover without a
        restart. Probe error details stay in the logs.
      security: []
      responses:
        '200':
          description: Required dependencies are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              examples:
                ready:
                  summary: Database reachable
                  value:
                    status: ready
                    checks:
                      database: up
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              examples:
                notReady:
                  summary: Database unreachable
                  value:
                    status: not_ready
                    checks:
                      database: down
  /api/v1/dashboard:
    get:
      tags: [dashboard]
      operationId: getDispatchDashboardSummary
      summary: Get the dispatch dashboard summary
      description: Returns organization-scoped order, route, delivery and incident counts, recent activity, and active-route positions. ADMIN and DISPATCHER roles are allowed.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard summary.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DispatchDashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tracking/ticket:
    post:
      tags: [tracking]
      operationId: createTrackingTicket
      summary: Issue a short-lived WebSocket ticket
      description: Requires an authenticated user. The ticket is bound to that user's current identity and request Origin, expires after 30 seconds, and can be redeemed once at the tracking WebSocket endpoint. It is returned with Cache-Control private, no-store.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '201':
          description: One-use ticket issued.
          headers:
            Cache-Control:
              schema: { type: string, example: private, no-store }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [ticket, expiresAt]
                    properties:
                      ticket: { type: string, description: Opaque one-use credential; keep secret. }
                      expiresAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Live tracking is unavailable.
  /api/v1/tracking/socket:
    get:
      tags: [tracking]
      operationId: connectTrackingWebSocket
      summary: Open the authenticated live-tracking WebSocket
      description: |
        This is a WebSocket upgrade endpoint, not a conventional JSON REST call.
        Obtain a ticket from `POST /api/v1/tracking/ticket`, then connect to this
        path with `ticket` as a query parameter. The ticket is single-use, expires
        after 30 seconds, and must be presented with the same Origin used when it
        was issued. Invalid, expired, reused, or mismatched tickets are rejected
        with HTTP 401 before upgrade.

        On connection the server sends a JSON object with `type: "snapshot"`, a
        sequence number, and `data`. A
        client may request a fresh snapshot by sending the exact JSON message
        `{"type":"snapshot"}`. Other client messages close the socket with code
        1008. Server updates contain `type: "update"`, a sequence number, a
        `kind`, and a `snapshot`;
        `kind` is `route`, `order`, or `position`. The server revalidates identity
        periodically and closes connections whose authorization is no longer valid.
      x-websocket: true
      security: []
      parameters:
        - in: query
          name: ticket
          required: true
          schema: { type: string }
          description: Single-use ticket from `POST /api/v1/tracking/ticket`.
      responses:
        '101':
          description: WebSocket protocol upgrade accepted.
        '401':
          description: Ticket is absent, expired, already consumed, bound to another Origin, or no longer authorized.
        '404':
          description: The upgrade path does not match the tracking WebSocket endpoint.
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate and start a device session
      description: |
        Authenticates a user inside one organization. When the server has
        `LOGIN_ORGANIZATION_ID` configured, the body must omit `organizationId`;
        otherwise the body must supply it. The browser uses the configured mode.

        Unknown email, wrong password and a disabled account all return the same
        generic `401 IDENTITY_INVALID_CREDENTIALS`, and every failure path pays
        one Argon2 verification so response time does not reveal whether the
        account exists.

        On success the access token is returned in the body and the raw refresh
        token is set as an `HttpOnly`, `SameSite=Strict`, `/api/v1/auth`-scoped
        cookie. The refresh token is never returned in JSON.

        After `LOGIN_RATE_LIMIT_MAX_ATTEMPTS` failures in
        `LOGIN_RATE_LIMIT_WINDOW_SECONDS` (keyed by IP + email), the endpoint
        returns `429` with `Retry-After`.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              dispatcher:
                summary: Dispatcher login
                value:
                  email: dispatcher@lima.test
                  password: correct-horse-1
      responses:
        '200':
          description: Authenticated. The refresh token is in the `Set-Cookie` header.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh cookie
      description: |
        Reads the refresh token from the cookie, consumes it atomically and
        returns a new access token plus a new refresh cookie in the same family.

        Presenting an already revoked token is treated as reuse: the whole
        family is revoked and the response is `401
        IDENTITY_REFRESH_REUSE_DETECTED`. Expired or unknown tokens are also
        `401`, and every rejected refresh clears the cookie (`Max-Age=0`).
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Rotated. The new refresh token is in the `Set-Cookie` header.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current refresh token
      description: |
        Revokes only the presented refresh token, so other devices stay signed
        in. Logout is idempotent: a missing, unknown or already revoked token is
        a successful no-op. The cookie is always cleared. Access tokens are
        stateless and expire within 15 minutes.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Logged out; the refresh cookie was cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Return the authenticated caller
      description: |
        Returns the identity resolved by the JWT middleware. The role is reloaded
        from storage, so a role change is visible on the next request even while
        an older access token is still cryptographically valid.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The current authenticated user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users:
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user in the caller organization (ADMIN only)
      description: |
        There is no self-registration. The authenticated ADMIN creates a user in
        their own organization with a temporary password that must satisfy the
        password policy. `organizationId` and `actorUserId` are taken from the
        verified session and are rejected if sent in the body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              dispatcher:
                summary: Create a dispatcher
                value:
                  email: new.dispatcher@lima.test
                  password: temporary-pass-1
                  role: DISPATCHER
      responses:
        '201':
          description: User created. The password hash is never returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/delivery-routes:
    get:
      tags: [delivery-routes]
      operationId: listDeliveryRoutes
      summary: List routes and progress for the authenticated organization
      description: ADMIN or DISPATCHER may list tenant-scoped planned, in-progress and completed routes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Tenant-scoped planned, in-progress and completed routes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliveryRouteResponse/properties/data'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [delivery-routes]
      operationId: planDeliveryRoute
      summary: Plan a route with a driver, vehicle, stops and orders
      description: |
        ADMIN or DISPATCHER plans at least one sequenced stop. Each stop is
        exactly one order and has no location of its own: while the order row
        is locked, the planner copies the order's delivery address and
        coordinates into the stop (a snapshot; later order edits do not move a
        planned route). An order without coordinates returns 409. The response
        keeps `stops[].orderIds`, always with one element. The driver and vehicle must be active and free
        from other active routes. Orders must be `created` or `returned`, owned
        by the caller's organization and not assigned to another active route.
        Planning commits the route, ordered stop/order links and audited order
        transitions in one transaction: `created → planned → assigned` for a
        first dispatch or `returned → planned → assigned` for a retry of the
        same order. A retry retains the old route and history but deactivates
        only its previous active order link. No delivery-attempt record is
        created until delivery execution is implemented. Rejections write
        nothing. Route start is a separate DRIVER action; GPS remains separate.

        Development-only simulation: `simulatedCompletionEnabled: true` is
        accepted only when the API runs with `NODE_ENV=development` set
        explicitly and `VALHALLA_URL` configured; otherwise it returns 400. A
        simulated route requires an `origin` and a driver without a linked
        account (409 otherwise, checked under the driver row lock). It starts
        in the planning transaction: the route is persisted `in_progress` with
        `startedAt`, its orders move to `in_transit` with one `in_progress`
        attempt each, and every history row records the planning user as
        actor. Use `GET /api/v1/delivery-routes/simulation` to check
        availability and eligible drivers first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanDeliveryRouteRequest'
      responses:
        '201':
          description: Planned route with ordered stops.
          headers:
            Location:
              description: Relative URL of the created route.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryRouteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/delivery-routes/simulation:
    get:
      tags: [delivery-routes]
      operationId: getRouteSimulation
      summary: Report whether development route simulation is available
      description: |
        ADMIN or DISPATCHER reads whether simulated routes can be planned and
        which drivers may be used. `enabled` is true only when the API runs
        with `NODE_ENV=development` set explicitly and `VALHALLA_URL`
        configured; in any other environment it is false and
        `eligibleDriverIds` is empty. When enabled, `eligibleDriverIds` lists
        the organization's active drivers that have no linked account.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Simulation availability for the caller's organization.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [enabled, eligibleDriverIds]
                    properties:
                      enabled:
                        type: boolean
                      eligibleDriverIds:
                        type: array
                        items:
                          type: string
                          format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/delivery-routes/mine:
    get:
      tags: [delivery-routes]
      operationId: getMyDeliveryRoute
      summary: Read the authenticated DRIVER's active route
      description: |
        The account must be explicitly linked to the route's active driver
        profile in the same organization. Unbound accounts and absent routes
        return 404. Ordered stops contain the current full order DTOs.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The driver's planned or in-progress route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverRouteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/delivery-routes/{routeId}/start:
    post:
      tags: [delivery-routes]
      operationId: startDeliveryRoute
      summary: Start an assigned route (DRIVER)
      description: |
        Only the explicitly linked active DRIVER can start a planned route.
        The route, all its assigned orders, and route/order audit records advance
        atomically to `in_progress`/`in_transit`. A repeated start or later
        reassignment is rejected; a rejected request changes no state.
      security:
        - bearerAuth: []
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Started route with orders in transit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverRouteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/delivery-routes/orders/{orderId}/confirm:
    post:
      tags: [delivery-routes]
      operationId: confirmDeliveryOrder
      summary: Confirm an order delivery with available private evidence (DRIVER)
      description: |
        Only the explicitly assigned active driver can confirm an in-transit order.
        One or two uploaded, available photos from its active attempt are required.
        The order and attempt transition to delivered with an audit record in one
        database transaction; the route remains in progress until explicitly completed.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [evidenceIds]
              properties:
                evidenceIds:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items: { type: string, format: uuid }
                receiverName: { type: [string, 'null'], maxLength: 120 }
                notes: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: Order confirmation was recorded.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/delivery-routes/orders/{orderId}/incidents:
    post:
      tags: [delivery-routes]
      operationId: reportDeliveryIncident
      summary: Report a photographed delivery incident (DRIVER)
      description: |
        Records the incident, its evidence links, failed attempt, returned order and
        order audit atomically. The order returns to the warehouse and cannot be
        retried in the field; redispatch remains a separate dispatcher decision.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [category, description, evidenceIds]
              properties:
                category:
                  type: string
                  enum: [recipient_absent, incorrect_address, delivery_refused, damaged_package, access_restricted, vehicle_issue, other]
                description: { type: string, minLength: 3, maxLength: 1000 }
                evidenceIds:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: Incident and failed delivery outcome were recorded.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/delivery-routes/{routeId}/complete:
    post:
      tags: [delivery-routes]
      operationId: completeDeliveryRoute
      summary: Explicitly complete a route after all orders have outcomes (DRIVER)
      description: |
        Only the assigned active driver can complete an in-progress route, and only
        when every active stop order is delivered or returned. The route completion
        and status audit are atomic; delivery of the last order never auto-completes it.
      security:
        - bearerAuth: []
      parameters:
        - name: routeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Completed route.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverRouteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/delivery-routes/{routeId}:
    get:
      tags: [delivery-routes]
      operationId: getDeliveryRoute
      summary: Read one route in the caller organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: routeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Route found inside the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryRouteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [delivery-routes]
      operationId: reassignDeliveryRoute
      summary: Replace the driver or vehicle of a planned route (ADMIN or DISPATCHER)
      description: |
        Reassigns one or both resources of a route while it is planned.
        Stops, links, order statuses and their audit history are untouched:
        orders remain assigned and no new history rows are written. The new
        driver or vehicle must be active, owned by the caller's organization
        and free of other active routes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: routeId
          in: path
          required: true
          schema:
            type: string
