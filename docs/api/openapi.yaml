  /api/v1/delivery-orders/resolve-map-link:
    post:
      tags: [delivery-orders]
      operationId: resolveDeliveryOrderMapLink
      summary: Resolve a Google Maps link to coordinates
      description: Fetches an HTTPS Google Maps URL through manually validated Google redirects and returns coordinates encoded in the resolved map URL. Page HTML is not downloaded or scraped.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
      responses:
        '200':
          description: Coordinates found.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [latitude, longitude]
                    properties:
                      latitude: { type: number, minimum: -90, maximum: 90 }
                      longitude: { type: number, minimum: -180, maximum: 180 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: The URL is unsupported or did not identify coordinates.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/delivery-orders:
    post:
      tags: [delivery-orders]
      operationId: createDeliveryOrder
      summary: Create a delivery order
      description: |
        Creates one order in the caller's organization. Only ADMIN and DISPATCHER
        may create orders; other authenticated roles receive 403.

        `organizationId` is not part of the request body: it comes from the
        verified JWT and a body field with that name is rejected as an unknown
        property. Public and package codes are generated from global sequences.
        `customerId` must identify an active
        customer in the caller's organization; unknown or cross-organization
        customers return 404 and inactive customers return 409.

        `timeWindow` is required and must be `AM` or `PM`; the API never assigns a
        default. Latitude and longitude are optional individually but must be
        provided together. `weightKg` is optional per package.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeliveryOrderRequest'
            examples:
              twoPackages:
                summary: Order with two packages and coordinates
                value:
                  customerId: 55555555-5555-4555-8555-555555555551
                  timeWindow: AM
                  recipient:
                    name: Ana Torres
                    phone: '+51 987 654 321'
                  deliveryAddress:
                    addressLine: Av. Javier Prado Este 1234
                    district: San Borja
                    googleMapsUrl: https://maps.app.goo.gl/example
                    latitude: -12.0975
                    longitude: -77.0023
                  packages:
                    - description: Sealed box
                      weightKg: 2.5
                    - description: Document envelope
      responses:
        '201':
          description: Order created.
          headers:
            Location:
              description: Relative URL of the created order.
              schema:
                type: string
              example: /api/v1/delivery-orders/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryOrderResponse'
              examples:
                created:
                  summary: Created order
                  value:
                    data:
                      id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                      organizationId: 11111111-1111-4111-8111-111111111111
                      customerId: 55555555-5555-4555-8555-555555555551
                      timeWindow: AM
                      publicCode: ORD-2026-0001
                      status: created
                      recipient:
                        name: Ana Torres
                        phone: '+51 987 654 321'
                      deliveryAddress:
                        addressLine: Av. Javier Prado Este 1234
                        district: San Borja
                        googleMapsUrl: null
                        latitude: -12.0975
                        longitude: -77.0023
                      packages:
                        - code: PKG-001
                          description: Sealed box
                          weightKg: 2.5
                        - code: PKG-002
                          description: Document envelope
                          weightKg: null
                      createdAt: '2026-10-26T20:00:00.000Z'
                      updatedAt: '2026-10-26T20:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [delivery-orders]
      # Preserve the generated-client operation name for existing code lookups.
      operationId: getDeliveryOrderByPublicCode
      summary: List tenant orders or read one by public code
      description: |
        Only ADMIN and DISPATCHER may access this general order catalog; DRIVER
        uses assigned-route execution endpoints. Without query parameters, lists
        the caller's organization orders in
        ascending creation time then id, including cancelled orders. An empty
        organization returns `data: []`. With `publicCode`, looks up exactly one
        order and preserves the existing single-resource response; unknown codes
        and codes owned by another organization both return 404.

        Unknown query parameters are rejected with 400. Other filters and
        pagination remain future work.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: publicCode
          in: query
          required: false
          description: Optional readable order code; when absent, return the tenant list.
          schema:
            type: string
            minLength: 3
            maxLength: 32
            pattern: '^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$'
          example: ORD-2026-0001
      responses:
        '200':
          description: Tenant order list or one order matching publicCode.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DeliveryOrderResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeliveryOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/delivery-orders/import:
    post:
      tags: [delivery-orders]
      operationId: importDeliveryOrders
      summary: Import CSV or XLSX delivery orders
      description: |
        ADMIN and DISPATCHER only. The caller's organization is resolved from the
        verified JWT; the file never supplies a tenant id. CSV and XLSX use the
        same strict columns. A customer is resolved by public code within that
        organization and must be active. Use one row per package and repeat every
        order-level value for all rows with the same publicCode. Any invalid row
        rejects its whole order group; other valid groups are imported. Unknown,
        missing required, or duplicate headers reject the entire file before any
        order is created. The upload is limited to 5 MB and 5,000 data rows.
        `latitude` and `longitude` are required headers and required values:
        an order group without coordinates is rejected with a
        `deliveryAddress.latitude` issue.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Valid order groups imported; rejected groups include source row references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryOrderImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Upload exceeds the 5 MB request limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: Content type is not CSV or XLSX.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/delivery-orders/import/template:
    get:
      tags: [delivery-orders]
      operationId: downloadDeliveryOrderImportTemplate
      summary: Download the XLSX order-import template
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Blank workbook with the shared order-import columns on the Orders worksheet.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="delivery-orders-template.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/delivery-orders/{orderId}:
    patch:
      tags: [delivery-orders]
      operationId: editDeliveryOrder
      summary: Edit order-owned details before planning (ADMIN or DISPATCHER)
      description: |
        Replaces each supplied recipient, deliveryAddress or ordered packages
        value while the order is created. Omitted values stay unchanged.
        Immutable identity, publicCode, status and createdAt are preserved.
        A non-created order rejects edits with 409, without changing history.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
