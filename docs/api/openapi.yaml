        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 access JWT (15 minutes) with `sub`, `organizationId`, `role`,
        `jti`, `iat`, `nbf`, `exp`, `iss` and `aud`. The refresh token is an
        opaque rotating secret in an HttpOnly cookie, never a JWT.
  parameters:
    RequestId:
      name: x-request-id
      in: header
      required: false
      description: |
        Optional correlation id. A value matching `^[A-Za-z0-9._:-]{1,128}$` is
        honored; otherwise the API generates a UUIDv4. The resolved value is
        echoed in the response header and in error bodies.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
      example: dispatcher-request-42
  headers:
    XRequestId:
      description: Correlation id for this request and its logs.
      schema:
        type: string
        format: uuid
    SetRefreshCookie:
      description: |
        Rotating refresh token: `erp_refresh_token=<token>; Path=/api/v1/auth;
        Max-Age=604800; HttpOnly; SameSite=Strict` (plus `Secure` when
        `COOKIE_SECURE=true`). The value is never present in the JSON body.
      schema:
        type: string
      example: erp_refresh_token=opaque-token; Path=/api/v1/auth; Max-Age=604800; HttpOnly; SameSite=Strict
    ClearRefreshCookie:
      description: 'Clears the refresh cookie: `erp_refresh_token=; Max-Age=0` with the same path and flags.'
      schema:
        type: string
      example: erp_refresh_token=; Path=/api/v1/auth; Max-Age=0; HttpOnly; SameSite=Strict
  responses:
    BadRequest:
      description: |
        Invalid input: Zod validation issues (`IDENTITY_INVALID_INPUT`,
        `DELIVERY_ORDER_INVALID_INPUT`, `CUSTOMER_INVALID_INPUT`,
        `DRIVER_INVALID_INPUT` or `VEHICLE_INVALID_INPUT` with `details.issues`),
        a weak password (`IDENTITY_WEAK_PASSWORD` with `details.reasons`), a
        malformed UUID or malformed JSON (`INVALID_JSON`), or a delivery-order
        import file with invalid columns or an unreadable workbook.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            identityValidation:
              summary: Identity field-level validation failure
              value:
                error:
                  code: IDENTITY_INVALID_INPUT
                  message: Login request body is invalid
                  details:
                    issues:
                      - path: email
                        message: email must be a valid address
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            weakPassword:
              summary: Password policy rejection
              value:
                error:
                  code: IDENTITY_WEAK_PASSWORD
                  message: Password does not meet the security policy
                  details:
                    reasons: [minimum_length, digit_required]
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            invalidJson:
              summary: Malformed JSON body
              value:
                error:
                  code: INVALID_JSON
                  message: Request body is not valid JSON
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    Unauthorized:
      description: |
        The caller is not authenticated, or a presented credential is not
        usable. Codes: `AUTH_TOKEN_MISSING`, `IDENTITY_INVALID_TOKEN`,
        `AUTH_SESSION_INVALID`, `IDENTITY_INVALID_CREDENTIALS`,
        `AUTH_REFRESH_TOKEN_MISSING`, `IDENTITY_REFRESH_NOT_FOUND` and
        `IDENTITY_REFRESH_REUSE_DETECTED`. Responses never echo the token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missingToken:
              summary: Bearer token absent
              value:
                error:
                  code: AUTH_TOKEN_MISSING
                  message: The Authorization header with a Bearer access token is required
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            invalidCredentials:
              summary: Generic login failure
              value:
                error:
                  code: IDENTITY_INVALID_CREDENTIALS
                  message: Invalid email or password
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            reuseDetected:
              summary: Refresh token replayed
              value:
                error:
                  code: IDENTITY_REFRESH_REUSE_DETECTED
                  message: Refresh token reuse detected; the session family was revoked
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    Forbidden:
      description: |
        The authenticated caller lacks the required role. `details` carries the
        `requiredRoles` and the stored `actualRole`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            dispatcherCannotCreateUser:
              summary: ADMIN required
              value:
                error:
                  code: AUTH_FORBIDDEN
                  message: Role DISPATCHER is not allowed to access this resource
                  details:
                    requiredRoles: [ADMIN]
                    actualRole: DISPATCHER
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    NotFound:
      description: |
        The order does not exist, or it belongs to another organization. Both
        cases return the same body and code (`DELIVERY_ORDER_NOT_FOUND`) so a
        caller cannot confirm existence across tenants.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unknownOrder:
              summary: Unknown order id or public code
              value:
                error:
                  code: DELIVERY_ORDER_NOT_FOUND
                  message: Delivery order 99999999-9999-4999-8999-999999999999 was not found
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    CatalogNotFound:
      description: |
        The customer, driver or vehicle does not exist in the caller
        organization. Another tenant's id returns the same body and code as an
        unknown id (`CUSTOMER_NOT_FOUND`, `DRIVER_NOT_FOUND` or
        `VEHICLE_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unknownCustomer:
              summary: Unknown customer id or another tenant's customer
              value:
                error:
                  code: CUSTOMER_NOT_FOUND
                  message: Customer bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb was not found
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            unknownDriver:
              summary: Unknown driver id or another tenant's driver
              value:
                error:
                  code: DRIVER_NOT_FOUND
                  message: Driver cccccccc-cccc-4ccc-8ccc-cccccccccccc was not found
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            unknownVehicle:
              summary: Unknown vehicle id or another tenant's vehicle
              value:
                error:
                  code: VEHICLE_NOT_FOUND
                  message: Vehicle dddddddd-dddd-4ddd-8ddd-dddddddddddd was not found
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    CatalogConflict:
      description: |
        A catalog identifier is already used in this organization:
        `CUSTOMER_INVARIANT_VIOLATION` (`publicCode`),
        `DRIVER_INVARIANT_VIOLATION` (`documentNumber`) or
        `VEHICLE_INVARIANT_VIOLATION` (`plate`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            duplicateCustomerCode:
              summary: Public code already used in the organization
              value:
                error:
                  code: CUSTOMER_INVARIANT_VIOLATION
                  message: Customer code CUS-2026-0001 is already used in organization 11111111-1111-4111-8111-111111111111
                  details:
                    field: publicCode
                    publicCode: CUS-2026-0001
                    organizationId: 11111111-1111-4111-8111-111111111111
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            duplicateDocument:
              summary: Document number already used in the organization
              value:
                error:
                  code: DRIVER_INVARIANT_VIOLATION
                  message: Driver document DNI-12345678 is already used in organization 11111111-1111-4111-8111-111111111111
                  details:
                    field: documentNumber
                    documentNumber: DNI-12345678
                    organizationId: 11111111-1111-4111-8111-111111111111
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            duplicatePlate:
              summary: Plate already used in the organization
              value:
                error:
                  code: VEHICLE_INVARIANT_VIOLATION
                  message: Vehicle plate ABC-123 is already used in organization 11111111-1111-4111-8111-111111111111
                  details:
                    field: plate
                    plate: ABC-123
                    organizationId: 11111111-1111-4111-8111-111111111111
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    Conflict:
      description: |
        A business invariant was violated. Codes: `IDENTITY_EMAIL_ALREADY_IN_USE`
        or `DELIVERY_ORDER_INVARIANT_VIOLATION`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            emailInUse:
              summary: Email already used in the organization
              value:
                error:
                  code: IDENTITY_EMAIL_ALREADY_IN_USE
                  message: Email is already in use in this organization
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            duplicatePublicCode:
              summary: Public code already used
              value:
                error:
                  code: DELIVERY_ORDER_INVARIANT_VIOLATION
                  message: Public code ORD-2026-0001 is already used in organization 11111111-1111-4111-8111-111111111111
                  details:
                    field: publicCode
                    publicCode: ORD-2026-0001
                    organizationId: 11111111-1111-4111-8111-111111111111
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    TooManyRequests:
      description: |
        The login attempt window for this IP + email is exhausted. `details`
        carries the remaining seconds and the `Retry-After` header matches it.
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
          example: 900
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            rateLimited:
              summary: Login attempts exhausted
              value:
                error:
                  code: AUTH_RATE_LIMITED
                  message: Too many login attempts; try again later
                  details:
                    retryAfterSeconds: 900
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    InternalServerError:
      description: |
        Unexpected failure. The response is generic (`INTERNAL_ERROR`); details are
        logged with the correlation id and never returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unexpected:
              summary: Unhandled failure
              value:
                error:
                  code: INTERNAL_ERROR
                  message: An unexpected error occurred while processing the request
                  correlationId: c0ffee00-0000-4000-8000-000000000000
  schemas:
    DeliveryEvidenceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DeliveryEvidence'
    DeliveryEvidence:
      type: object
      required: [id, orderId, attemptId, incidentId, mimeType, byteSize, checksum, uploadedBy, status, createdAt, availableAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
          nullable: true
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        byteSize:
          type: integer
          minimum: 1
          maximum: 5000000
        checksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
        uploadedBy:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending_upload, available]
        createdAt:
          type: string
          format: date-time
        availableAt:
          type: string
          format: date-time
          nullable: true
    DriverRouteResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, publicCode, plannedDate, driverId, vehicleId, status, startedAt, completedAt, stops]
          properties:
            id:
              type: string
              format: uuid
            publicCode:
              type: string
            plannedDate:
              type: string
              format: date
            driverId:
              type: string
              format: uuid
            vehicleId:
              type: string
              format: uuid
            status:
              type: string
              enum: [planned, in_progress, completed]
            startedAt:
              type: [string, 'null']
              format: date-time
            completedAt:
              type: [string, 'null']
              format: date-time
            stops:
              type: array
              items:
                type: object
                required: [id, sequence, addressLine, latitude, longitude, orders]
                properties:
                  id:
                    type: string
                    format: uuid
                  sequence:
                    type: integer
                  addressLine:
                    type: string
                  latitude:
                    type: [number, 'null']
                  longitude:
                    type: [number, 'null']
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliveryOrder'
    ReassignDeliveryRouteRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        driverId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
    PlanDeliveryRouteRequest:
      type: object
      additionalProperties: false
      required: [publicCode, plannedDate, driverId, vehicleId, stops]
      properties:
        publicCode:
          type: string
          minLength: 3
          maxLength: 32
          description: Readable route code, normalized to uppercase per organization.
        plannedDate:
          type: string
          format: date
        driverId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        simulatedCompletionEnabled:
          type: boolean
          default: false
          description: |
            Development only. Starts the route at planning and lets the GPS
            simulator close every reached stop (orders delivered) and then the
            route. Requires `origin`, a driver without a linked account,
            `NODE_ENV=development` and `VALHALLA_URL`; otherwise 400 or 409.
        origin:
          type: object
          additionalProperties: false
          required: [addressLine]
          description: Optional route start point. Provide a Google Maps URL or both coordinates.
          oneOf:
            - required: [googleMapsUrl]
            - required: [latitude, longitude]
          properties:
            addressLine:
              type: string
              minLength: 5
              maxLength: 200
            googleMapsUrl:
              type: string
              format: uri
              maxLength: 2048
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
        stops:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [sequence, orderId]
            description: |
              One order per stop. Address and coordinates are not accepted
              here; they are copied from the order.
            properties:
              sequence:
                type: integer
                minimum: 1
                description: Visiting order; unique within the route.
              orderId:
                type: string
                format: uuid
                description: Unique within the route.
    DeliveryRouteResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, organizationId, publicCode, plannedDate, driverId, vehicleId, status, createdAt, stops]
          properties:
            id:
              type: string
              format: uuid
            organizationId:
              type: string
              format: uuid
            publicCode:
              type: string
            plannedDate:
              type: string
              format: date
            driverId:
              type: string
              format: uuid
            vehicleId:
              type: string
              format: uuid
            status:
              type: string
              enum: [planned, in_progress, completed]
            createdAt:
              type: string
              format: date-time
            origin:
              type: object
              required: [addressLine, latitude, longitude]
              properties:
                addressLine:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
            startedAt:
              type: string
              format: date-time
            completedAt:
              type: string
              format: date-time
            stops:
              type: array
              items:
                type: object
                required: [id, sequence, addressLine, latitude, longitude, orderIds]
                properties:
                  id:
                    type: string
                    format: uuid
                  sequence:
                    type: integer
                  addressLine:
                    type: string
                  latitude:
                    type: [number, 'null']
                  longitude:
                    type: [number, 'null']
                  orderIds:
                    type: array
                    items:
                      type: string
                      format: uuid
    UserRole:
      type: string
      enum: [ADMIN, DISPATCHER, DRIVER]
    UserStatus:
      type: string
      enum: [active, disabled]
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, organizationId, email, role]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
    User:
      type: object
      additionalProperties: false
      required: [id, organizationId, email, role, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        organizationId:
          type: string
          format: uuid
          description: Required only when LOGIN_ORGANIZATION_ID is not configured; otherwise rejected.
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 200
    AuthSession:
      type: object
      additionalProperties: false
      required: [user, accessToken, accessTokenExpiresAt, refreshTokenExpiresAt]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        accessToken:
          type: string
          description: 'HS256 JWT for the `Authorization: Bearer` header.'
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: The refresh token itself is only sent in the cookie.
    AuthSessionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AuthSession'
    CurrentUserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CurrentUser'
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          description: |
            Temporary password; at least 10 characters with one letter and one
            digit. Rejected with `IDENTITY_WEAK_PASSWORD`.
        role:
          $ref: '#/components/schemas/UserRole'
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    DeliveryOrderStatus:
      type: string
      description: |
        Canonical order statuses (DO-001). The pilot only creates `created` orders;
        transitions arrive with later modules.
      enum: [created, planned, assigned, in_transit, delivered, returned, cancelled]
    Recipient:
      type: object
      additionalProperties: false
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Ana Torres
        phone:
          type: string
          minLength: 6
          maxLength: 20
          pattern: '^\+?[0-9][0-9 ()-]*$'
          description: Digits, spaces, parentheses, hyphens and an optional leading `+`.
          example: '+51 987 654 321'
    DeliveryAddress:
      type: object
      additionalProperties: false
      required: [addressLine, district]
      properties:
        addressLine:
          type: string
          minLength: 5
          maxLength: 200
          example: Av. Javier Prado Este 1234
        district:
          type: string
          minLength: 2
          maxLength: 80
          example: San Borja
        googleMapsUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          description: Optional saved Google Maps link.
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          example: -12.0975
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
          example: -77.0023
      dependentRequired:
        latitude: [longitude]
        longitude: [latitude]
    DeliveryAddressInput:
      type: object
      additionalProperties: false
      required: [addressLine, district, latitude, longitude]
      description: |
        Create/edit shape. Coordinates are required because route stops copy
        the order's location. The Google Maps link is an optional reference;
        resolve it first with `POST /api/v1/delivery-orders/resolve-map-link`.
      properties:
        addressLine:
          type: string
          minLength: 5
          maxLength: 200
          example: Av. Javier Prado Este 1234
        district:
          type: string
          minLength: 2
          maxLength: 80
          example: San Borja
        googleMapsUrl:
          type: string
          format: uri
          maxLength: 2048
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: -12.0975
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: -77.0023
    Package:
      type: object
      additionalProperties: false
      required: [code, description, weightKg]
      description: Response shape; `weightKg` is `null` when it was not supplied.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,39}$'
          example: PKG-001
        description:
          type: string
          minLength: 1
          maxLength: 200
          example: Sealed box
        weightKg:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 1000
          example: 2.5
    CreatePackage:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          description: Letters, digits, hyphens and underscores; normalized to uppercase.
          description: Optional for order creation; when omitted the server generates a global package code. Required when editing.
        description:
          type: string
          minLength: 1
          maxLength: 200
          example: Sealed box
        weightKg:
          type: number
          exclusiveMinimum: 0
          maximum: 1000
          example: 2.5
    DeliveryOrder:
      type: object
      required:
        - id
        - organizationId
        - customerId
        - timeWindow
        - publicCode
        - status
        - recipient
        - deliveryAddress
        - packages
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
          description: Customer account that contracted this delivery.
        timeWindow:
          type: string
          enum: [AM, PM]
          description: Explicitly selected delivery window.
        publicCode:
          type: string
          example: ORD-2026-0001
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
        recipient:
          $ref: '#/components/schemas/Recipient'
        deliveryAddress:
          allOf:
            - $ref: '#/components/schemas/DeliveryAddress'
          description: Response shape; absent coordinates are `null`.
        packages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Package'
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 instant (UTC `Z`). Render at America/Lima (`-05:00`).
          example: '2026-10-26T20:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 instant (UTC `Z`). Render at America/Lima (`-05:00`).
          example: '2026-10-26T20:00:00.000Z'
    CreateDeliveryOrderRequest:
      type: object
      additionalProperties: false
      required: [customerId, timeWindow, recipient, deliveryAddress, packages]
      properties:
        customerId:
          type: string
          format: uuid
          description: Must identify a customer in the authenticated organization.
        timeWindow:
          type: string
          enum: [AM, PM]
          description: Required delivery window; there is no implicit default.
        publicCode:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$'
          description: Normalized to uppercase and unique per organization.
          example: ORD-2026-0001
        recipient:
          $ref: '#/components/schemas/Recipient'
        deliveryAddress:
          $ref: '#/components/schemas/DeliveryAddressInput'
        packages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CreatePackage'
    EditDeliveryOrderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        recipient:
          $ref: '#/components/schemas/Recipient'
        deliveryAddress:
          $ref: '#/components/schemas/DeliveryAddressInput'
        packages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CreatePackage'
    DeliveryOrderResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DeliveryOrder'
    DeliveryOrderImportResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [importedOrders, rejectedOrders]
          properties:
            importedOrders:
              type: array
              items:
                $ref: '#/components/schemas/DeliveryOrder'
            rejectedOrders:
              type: array
              items:
                $ref: '#/components/schemas/RejectedDeliveryOrderImport'
    RejectedDeliveryOrderImport:
      type: object
      required: [publicCode, rowNumbers, issues]
      properties:
        publicCode:
          type: [string, 'null']
          description: Normalized public code, or null when the rows could not be grouped by code.
        rowNumbers:
          type: array
          items:
            type: integer
            minimum: 2
        issues:
          type: array
          items:
            type: object
            required: [rowNumber, field, message]
            properties:
              rowNumber:
                type: integer
                minimum: 2
              field:
                type: string
              message:
                type: string
    CatalogStatus:
      type: string
      enum: [active, inactive]
    Customer:
      type: object
      additionalProperties: false
      required:
        [id, organizationId, publicCode, name, contactName, contactEmail, contactPhone, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        publicCode:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Z0-9]+(?:-[A-Z0-9]+)*$'
        name:
          type: string
          minLength: 2
          maxLength: 120
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        contactEmail:
          type: string
          format: email
          maxLength: 254
        contactPhone:
          type: string
          minLength: 6
          maxLength: 32
        status:
          $ref: '#/components/schemas/CatalogStatus'
        createdAt:
          type: string
          format: date-time
    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required: [publicCode, name, contactName, contactEmail, contactPhone]
      properties:
        publicCode:
          type: string
          minLength: 3
          maxLength: 32
          description: Trimmed and uppercased; unique per organization.
        name:
          type: string
          minLength: 2
          maxLength: 120
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        contactEmail:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased.
        contactPhone:
          type: string
          minLength: 6
          maxLength: 32
        status:
          $ref: '#/components/schemas/CatalogStatus'
          default: active
    CustomerResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Customer'
    CustomerListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
    Driver:
      type: object
      additionalProperties: false
      required:
        [id, organizationId, fullName, documentNumber, phone, licenseNumber, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        documentNumber:
          type: string
          minLength: 6
          maxLength: 20
          description: Immutable after creation.
        phone:
          type: string
          minLength: 6
          maxLength: 32
        licenseNumber:
          type: string
          minLength: 4
          maxLength: 40
        status:
          $ref: '#/components/schemas/CatalogStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateDriverRequest:
      type: object
      additionalProperties: false
      required: [fullName, documentNumber, phone, licenseNumber]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        documentNumber:
          type: string
          minLength: 6
          maxLength: 20
          description: Trimmed and uppercased; unique per organization.
        phone:
          type: string
          minLength: 6
          maxLength: 32
        licenseNumber:
          type: string
          minLength: 4
          maxLength: 40
        status:
          $ref: '#/components/schemas/CatalogStatus'
          default: active
    UpdateDriverRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        At least one mutable field. `documentNumber` and the tenant are not
        editable; `updatedAt` is stamped by the server.
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 6
          maxLength: 32
        licenseNumber:
          type: string
          minLength: 4
          maxLength: 40
        status:
          $ref: '#/components/schemas/CatalogStatus'
    DriverResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Driver'
    DriverAccountBindingResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [driverId, userId]
          properties:
            driverId:
              type: string
              format: uuid
            userId:
              type: [string, 'null']
              format: uuid
    DriverListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Driver'
    Vehicle:
      type: object
      additionalProperties: false
      required:
        [id, organizationId, plate, type, capacityKg, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        plate:
          type: string
          minLength: 3
          maxLength: 16
          pattern: '^[A-Z0-9]+(?:-[A-Z0-9]+)*$'
          description: Immutable after creation.
        type:
          type: string
          minLength: 2
          maxLength: 40
          description: Free text in this milestone.
        capacityKg:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 100000
        status:
          $ref: '#/components/schemas/CatalogStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateVehicleRequest:
      type: object
      additionalProperties: false
      required: [plate, type]
      properties:
        plate:
          type: string
          minLength: 3
          maxLength: 16
          description: Trimmed and uppercased; unique per organization.
        type:
          type: string
          minLength: 2
          maxLength: 40
        capacityKg:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 100000
        status:
          $ref: '#/components/schemas/CatalogStatus'
          default: active
    UpdateVehicleRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        At least one mutable field. The plate and the tenant are not editable.
        Omitting `capacityKg` keeps the stored value; `null` clears it.
      properties:
        type:
          type: string
          minLength: 2
          maxLength: 40
        capacityKg:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 100000
        status:
          $ref: '#/components/schemas/CatalogStatus'
    VehicleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Vehicle'
    VehicleListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
    ValidationIssue:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          description: Dot-separated field path; empty for a body-level issue.
          example: recipient.phone
        message:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: DELIVERY_ORDER_INVALID_INPUT
            message:
              type: string
              description: Human-readable message; never contains raw input or internals.
            details:
              type: object
              additionalProperties: true
              description: |
                Optional structured context. Validation failures carry
                `issues: ValidationIssue[]`; a weak password carries `reasons`;
                a role rejection carries `requiredRoles` and `actualRole`; a
                rate limit carries `retryAfterSeconds`. Never contains request
                bodies or personal data.
            correlationId:
              type: string
              format: uuid
              description: Matches the `x-request-id` response header.
    DispatchDashboardSummary:
      type: object
      required: [ordersAwaitingPlanning, routesInProgress, deliveriesToday, incidentsToday, orderStatusCounts, recentOrders, recentIncidents, activeRoutes]
      properties:
        ordersAwaitingPlanning: { type: integer, minimum: 0 }
        routesInProgress: { type: integer, minimum: 0 }
        deliveriesToday: { type: integer, minimum: 0 }
        incidentsToday: { type: integer, minimum: 0 }
        orderStatusCounts:
          type: object
          description: Count of orders by lifecycle status; all defined statuses are present.
          additionalProperties: { type: integer, minimum: 0 }
        recentOrders:
          type: array
          items:
            type: object
            required: [id, publicCode, status, createdAt]
            properties:
              id: { type: string, format: uuid }
              publicCode: { type: string }
              status: { $ref: '#/components/schemas/DeliveryOrderStatus' }
              createdAt: { type: string, format: date-time }
        recentIncidents:
          type: array
          items:
            type: object
            required: [id, orderId, publicCode, category, description, occurredAt]
            properties:
              id: { type: string, format: uuid }
              orderId: { type: string, format: uuid }
              publicCode: { type: string }
              category: { type: string }
              description: { type: string }
              occurredAt: { type: string, format: date-time }
        activeRoutes:
          type: array
          items:
            type: object
            required: [id, publicCode, plannedDate, lastPosition]
            properties:
              id: { type: string, format: uuid }
              publicCode: { type: string }
              plannedDate: { type: string, format: date }
              lastPosition:
                oneOf:
                  - type: 'null'
                  - type: object
                    required: [latitude, longitude, receivedAt]
                    properties:
                      latitude: { type: number, minimum: -90, maximum: 90 }
                      longitude: { type: number, minimum: -180, maximum: 180 }
                      receivedAt: { type: string, format: date-time }
    LivenessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [up, down]
