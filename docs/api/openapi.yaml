      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancelled order with unchanged id and createdAt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/delivery-orders/{orderId}/history:
    get:
      tags: [delivery-orders]
      operationId: getDeliveryOrderStatusHistory
      summary: Read an order's audited status changes
      description: Only ADMIN and DISPATCHER may read general order history. The order's organization scope still applies; unknown and foreign order ids return the same 404 response.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: orderId
          in: path
