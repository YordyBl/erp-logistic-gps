          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditDeliveryOrderRequest'
      responses:
        '200':
          description: Updated order; status and createdAt unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [delivery-orders]
      operationId: getDeliveryOrder
      summary: Read a delivery order by internal id
      description: |
        Only ADMIN and DISPATCHER may use this general order read. DRIVER accesses
        assigned orders through route execution. Returns one order owned by the caller's organization. A cross-organization
        read is indistinguishable from an unknown id: both return 404 with code
        `DELIVERY_ORDER_NOT_FOUND` (DO-010).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: orderId
          in: path
          required: true
          description: Internal order UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order found in the caller's organization.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/delivery-orders/{orderId}/cancel:
    post:
      tags: [delivery-orders]
      operationId: cancelDeliveryOrder
      summary: Cancel an order without deleting it (ADMIN or DISPATCHER)
      description: |
        Cancels an order in created, planned or assigned status. The authenticated
        user's id, previous status and cancellation instant are committed with the
