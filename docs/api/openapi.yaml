  /api/v1/drivers/{driverId}/account:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: driverId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [drivers]
      operationId: getDriverAccountBinding
      summary: Read a driver's account binding (ADMIN)
      description: |
        Unbound drivers return `userId: null`; other tenants return 404.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAccountBindingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
    put:
      tags: [drivers]
      operationId: bindDriverAccount
      summary: Bind or unbind one driver account (ADMIN)
      description: |
        Link an existing active DRIVER account in the same organization to one
        driver profile. `null` explicitly revokes the link; omitted fields and
        other tenants are rejected. A user can belong to only one driver profile.
        Binding changes are audited atomically; ordinary catalog PATCH cannot
        change this association. Unbound profiles remain valid for dispatch.
        Binding an account to a driver that has a `planned` or `in_progress`
        simulated route returns 409; the check runs under the driver row lock.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId:
                  type: [string, 'null']
                  format: uuid
      responses:
        '200':
          description: Current binding after the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAccountBindingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/vehicles:
    post:
      tags: [vehicles]
      operationId: createVehicle
      summary: Create a vehicle (ADMIN or DISPATCHER)
      description: |
        Creates a vehicle in the caller's organization. The plate is trimmed,
        uppercased and unique per organization (409 on duplicates). `capacityKg`
        is optional and nullable; `type` is free text in this milestone.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
