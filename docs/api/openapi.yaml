      tags: [drivers]
      operationId: listDriverAccountOptions
      summary: List same-organization DRIVER accounts for linking (ADMIN)
      description: |
        Returns only accounts in the caller organization with role DRIVER, along
        with status and their current driver profile id when linked. Password
        hashes and other account fields are never returned. Binding still checks
        tenant, role, status and uniqueness atomically when the link is saved.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Same-tenant driver account options.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [userId, email, status, driverId]
                      properties:
                        userId:
                          type: string
                          format: uuid
                        email:
                          type: string
                          format: email
                        status:
                          type: string
                          enum: [active, disabled]
                        driverId:
                          type: [string, 'null']
                          format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/drivers/{driverId}:
    get:
      tags: [drivers]
      operationId: getDriver
      summary: Read a driver by id
      description: |
        Returns one driver owned by the caller organization. Only ADMIN and
        DISPATCHER may read the catalog. Another organization's id is
        indistinguishable from an unknown one: `404 DRIVER_NOT_FOUND`.
      security:
        - bearerAuth: []
