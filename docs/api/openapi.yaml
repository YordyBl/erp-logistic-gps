                summary: Van with an 800 kg payload
                value:
                  plate: ABC-123
                  type: van
                  capacityKg: 800
      responses:
        '201':
          description: Vehicle created.
          headers:
            Location:
              description: Relative URL of the created vehicle.
              schema:
                type: string
              example: /api/v1/vehicles/dddddddd-dddd-4ddd-8ddd-dddddddddddd
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CatalogConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [vehicles]
      operationId: listVehicles
      summary: List vehicles of the caller organization
      description: |
        Returns the caller organization vehicles, oldest first. Every
        authenticated role may read the catalog.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Vehicles of the caller organization.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/vehicles/{vehicleId}:
    get:
      tags: [vehicles]
      operationId: getVehicle
      summary: Read a vehicle by id
      description: |
        Returns one vehicle owned by the caller organization. Another
        organization's id is indistinguishable from an unknown one:
        `404 VEHICLE_NOT_FOUND`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: vehicleId
          in: path
