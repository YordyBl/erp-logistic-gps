openapi: 3.1.0
info:
  title: ERP Logistic API
  version: 0.2.0
  summary: Last-mile delivery ERP for Lima Metropolitana and Callao
  description: |
    Fase 1 HTTP contract: JWT authentication, the pilot `delivery-orders`
    module, and the org-scoped customer, driver and vehicle catalogs.

    **Authentication.** Every `/api/v1` business route requires
    `Authorization: Bearer <access JWT>`. The token is HS256-only and carries
    `sub`, `organizationId`, `role`, `jti`, `iat`, `nbf`, `exp`, `iss` and
    `aud`. The API verifies all of them, then reloads the user and role from
    storage, so a deleted, disabled or demoted account takes effect on the next
    request. `POST /api/v1/auth/login` returns the access token in the body and
    the rotating refresh token in an `HttpOnly` + `SameSite=Strict` cookie
    (`Secure` is environment-driven). The cookie is scoped to `/api/v1/auth`
    and is never readable by JavaScript.

    **Tenant context.** The organization comes only from the verified token.
    The Fase 0 `x-organization-id` header no longer exists; a caller cannot
    claim another tenant.

    **Timestamps.** `createdAt` and `updatedAt` are ISO-8601 instants (UTC `Z`
    on the wire, `timestamptz` in PostgreSQL). The ratified convention is
    America/Lima: clients and logs render the same instant at `-05:00`. Lima
    has no daylight saving time.

    **Correlation.** Every response carries `x-request-id`. A safe incoming
    value is honored; otherwise the API generates a UUIDv4. The same value
    appears as `correlationId` in error bodies.

    **Errors.** Non-2xx API responses use one envelope:
    `{ "error": { "code", "message", "details?", "correlationId" } }`. Health
    readiness (`/readyz`) is the documented exception: it returns a status
    document because it reports a dependency state, not a client error.
servers:
  - url: http://localhost:3000
    description: Local development (Docker Compose or `npx tsx src/main.ts`)
tags:
  - name: auth
    description: Login, refresh rotation, logout and the current caller
  - name: users
    description: ADMIN-only user provisioning
  - name: delivery-orders
    description: Create and read delivery orders inside one organization
  - name: customers
    description: Customer catalog inside one organization
  - name: drivers
    description: Driver catalog inside one organization
  - name: vehicles
    description: Fleet catalog inside one organization
  - name: health
    description: Liveness and readiness probes
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Returns 200 while the process can serve HTTP. The container healthcheck
        uses this endpoint. It never depends on the database.
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessStatus'
  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Runs the injected readiness probe (a `SELECT 1` against PostgreSQL) and
        reports 503 while the dependency is unavailable. The API starts before the
        database is reachable and retries lazily, so a 503 can recover without a
        restart. Probe error details stay in the logs.
      responses:
        '200':
          description: Required dependencies are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              examples:
                ready:
                  summary: Database reachable
                  value:
                    status: ready
                    checks:
                      database: up
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              examples:
                notReady:
                  summary: Database unreachable
                  value:
                    status: not_ready
                    checks:
                      database: down
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate and start a device session
      description: |
        Authenticates a user inside one organization. Emails are unique per
        organization, so `organizationId` is part of the body.

        Unknown email, wrong password and a disabled account all return the same
        generic `401 IDENTITY_INVALID_CREDENTIALS`, and every failure path pays
        one Argon2 verification so response time does not reveal whether the
        account exists.

        On success the access token is returned in the body and the raw refresh
        token is set as an `HttpOnly`, `SameSite=Strict`, `/api/v1/auth`-scoped
        cookie. The refresh token is never returned in JSON.

        After `LOGIN_RATE_LIMIT_MAX_ATTEMPTS` failures in
        `LOGIN_RATE_LIMIT_WINDOW_SECONDS` (keyed by IP + email), the endpoint
        returns `429` with `Retry-After`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              admin:
                summary: Dispatcher login
                value:
                  organizationId: 11111111-1111-4111-8111-111111111111
                  email: dispatcher@lima.test
                  password: correct-horse-1
      responses:
        '200':
          description: Authenticated. The refresh token is in the `Set-Cookie` header.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh cookie
      description: |
        Reads the refresh token from the cookie, consumes it atomically and
        returns a new access token plus a new refresh cookie in the same family.

        Presenting an already revoked token is treated as reuse: the whole
        family is revoked and the response is `401
        IDENTITY_REFRESH_REUSE_DETECTED`. Expired or unknown tokens are also
        `401`, and every rejected refresh clears the cookie (`Max-Age=0`).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Rotated. The new refresh token is in the `Set-Cookie` header.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current refresh token
      description: |
        Revokes only the presented refresh token, so other devices stay signed
        in. Logout is idempotent: a missing, unknown or already revoked token is
        a successful no-op. The cookie is always cleared. Access tokens are
        stateless and expire within 15 minutes.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Logged out; the refresh cookie was cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Return the authenticated caller
      description: |
        Returns the identity resolved by the JWT middleware. The role is reloaded
        from storage, so a role change is visible on the next request even while
        an older access token is still cryptographically valid.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The current authenticated user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users:
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user in the caller organization (ADMIN only)
      description: |
        There is no self-registration. The authenticated ADMIN creates a user in
        their own organization with a temporary password that must satisfy the
        password policy. `organizationId` and `actorUserId` are taken from the
        verified session and are rejected if sent in the body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              dispatcher:
                summary: Create a dispatcher
                value:
                  email: new.dispatcher@lima.test
                  password: temporary-pass-1
                  role: DISPATCHER
      responses:
        '201':
          description: User created. The password hash is never returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/delivery-orders:
    post:
      tags: [delivery-orders]
      operationId: createDeliveryOrder
      summary: Create a delivery order
      description: |
        Creates one order in the caller's organization.

        `organizationId` is not part of the request body: it comes from the
        verified JWT and a body field with that name is rejected as an unknown
        property. `publicCode` is normalized to uppercase and must be unique per
        organization (409 on duplicates).

        Latitude and longitude are optional individually but must be provided
        together. `weightKg` is optional per package.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeliveryOrderRequest'
            examples:
              twoPackages:
                summary: Order with two packages and coordinates
                value:
                  publicCode: ORD-2026-0001
                  recipient:
                    name: Ana Torres
                    phone: '+51 987 654 321'
                  deliveryAddress:
                    addressLine: Av. Javier Prado Este 1234
                    district: San Borja
                    latitude: -12.0975
                    longitude: -77.0023
                  packages:
                    - code: PKG-001
                      description: Sealed box
                      weightKg: 2.5
                    - code: PKG-002
                      description: Document envelope
      responses:
        '201':
          description: Order created.
          headers:
            Location:
              description: Relative URL of the created order.
              schema:
                type: string
              example: /api/v1/delivery-orders/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryOrderResponse'
              examples:
                created:
                  summary: Created order
                  value:
                    data:
                      id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                      organizationId: 11111111-1111-4111-8111-111111111111
                      publicCode: ORD-2026-0001
                      status: created
                      recipient:
                        name: Ana Torres
                        phone: '+51 987 654 321'
                      deliveryAddress:
                        addressLine: Av. Javier Prado Este 1234
                        district: San Borja
                        latitude: -12.0975
                        longitude: -77.0023
                      packages:
                        - code: PKG-001
                          description: Sealed box
                          weightKg: 2.5
                        - code: PKG-002
                          description: Document envelope
                          weightKg: null
                      createdAt: '2026-10-26T20:00:00.000Z'
                      updatedAt: '2026-10-26T20:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [delivery-orders]
      operationId: getDeliveryOrderByPublicCode
      summary: Read a delivery order by public code
      description: |
        Looks up one order by its readable public code inside the caller's
        organization and returns the same resource shape as the other read
        endpoint. Unknown codes and codes owned by another organization are both
        404 (enumeration safety).

        Other list filters and pagination are future work; a request without
        `publicCode` is rejected with 400.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: publicCode
          in: query
          required: true
          description: Readable order code, case-insensitive (normalized to uppercase).
          schema:
            type: string
            minLength: 3
            maxLength: 32
            pattern: '^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$'
          example: ORD-2026-0001
      responses:
        '200':
          description: Order found in the caller's organization.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/delivery-orders/{orderId}:
    get:
      tags: [delivery-orders]
      operationId: getDeliveryOrder
      summary: Read a delivery order by internal id
      description: |
        Returns one order owned by the caller's organization. A cross-organization
        read is indistinguishable from an unknown id: both return 404 with code
        `DELIVERY_ORDER_NOT_FOUND` (DO-010).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: orderId
          in: path
          required: true
          description: Internal order UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order found in the caller's organization.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/customers:
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Create a customer (ADMIN or DISPATCHER)
      description: |
        Creates a customer in the caller's organization. `organizationId` is not
        part of the body: it comes from the verified JWT, and a body field with
        that name is rejected as an unknown property. `publicCode` is trimmed,
        uppercased and unique per organization (409 on duplicates).

        The customer catalog has no update or delete route in this milestone.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
            examples:
              distributor:
                summary: Corporate customer with a contact person
                value:
                  publicCode: CUS-2026-0001
                  name: Distribuidora Lima SAC
                  contactName: Ana Torres
                  contactEmail: contacto@distribuidora.pe
                  contactPhone: '+51 987 654 321'
      responses:
        '201':
          description: Customer created.
          headers:
            Location:
              description: Relative URL of the created customer.
              schema:
                type: string
              example: /api/v1/customers/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CatalogConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [customers]
      operationId: listCustomers
      summary: List customers of the caller organization
      description: |
        Returns the caller organization customers, oldest first. Every
        authenticated role may read the catalog; filters and pagination are
        future work.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Customers of the caller organization.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/customers/{customerId}:
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Read a customer by id
      description: |
        Returns one customer owned by the caller organization. An unknown id and
        an id from another organization both return `404 CUSTOMER_NOT_FOUND`
        (enumeration safety).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: customerId
          in: path
          required: true
          description: Internal customer UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Customer found in the caller organization.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/drivers:
    post:
      tags: [drivers]
      operationId: createDriver
      summary: Create a driver (ADMIN or DISPATCHER)
      description: |
        Creates a driver in the caller's organization. `organizationId` is not
        part of the body and is rejected if sent. `documentNumber` and
        `licenseNumber` are trimmed and uppercased; the document number is unique
        per organization (409 on duplicates) and immutable afterwards.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDriverRequest'
            examples:
              driver:
                summary: Driver with a national identity document
                value:
                  fullName: Luis Quispe
                  documentNumber: DNI-12345678
                  phone: '+51 911 222 333'
                  licenseNumber: Q-987654
      responses:
        '201':
          description: Driver created.
          headers:
            Location:
              description: Relative URL of the created driver.
              schema:
                type: string
              example: /api/v1/drivers/cccccccc-cccc-4ccc-8ccc-cccccccccccc
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CatalogConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [drivers]
      operationId: listDrivers
      summary: List drivers of the caller organization
      description: |
        Returns the caller organization drivers, oldest first. Every
        authenticated role may read the catalog.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Drivers of the caller organization.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/drivers/{driverId}:
    get:
      tags: [drivers]
      operationId: getDriver
      summary: Read a driver by id
      description: |
        Returns one driver owned by the caller organization. Another
        organization's id is indistinguishable from an unknown one:
        `404 DRIVER_NOT_FOUND`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: driverId
          in: path
          required: true
          description: Internal driver UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Driver found in the caller organization.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [drivers]
      operationId: updateDriver
      summary: Update a driver (ADMIN or DISPATCHER)
      description: |
        Partial update of the mutable driver fields. At least one field is
        required. The document number, tenant, id and creation time are immutable;
        `updatedAt` is stamped by the server. Omitted fields keep their value.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: driverId
          in: path
          required: true
          description: Internal driver UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverRequest'
            examples:
              deactivate:
                summary: Rename and deactivate a driver
                value:
                  fullName: Luis Quispe Rojas
                  status: inactive
      responses:
        '200':
          description: Driver updated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/vehicles:
    post:
      tags: [vehicles]
      operationId: createVehicle
      summary: Create a vehicle (ADMIN or DISPATCHER)
      description: |
        Creates a vehicle in the caller's organization. The plate is trimmed,
        uppercased and unique per organization (409 on duplicates). `capacityKg`
        is optional and nullable; `type` is free text in this milestone.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
            examples:
              van:
                summary: Van with an 800 kg payload
                value:
                  plate: ABC-123
                  type: van
                  capacityKg: 800
      responses:
        '201':
          description: Vehicle created.
          headers:
            Location:
              description: Relative URL of the created vehicle.
              schema:
                type: string
              example: /api/v1/vehicles/dddddddd-dddd-4ddd-8ddd-dddddddddddd
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CatalogConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [vehicles]
      operationId: listVehicles
      summary: List vehicles of the caller organization
      description: |
        Returns the caller organization vehicles, oldest first. Every
        authenticated role may read the catalog.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Vehicles of the caller organization.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/vehicles/{vehicleId}:
    get:
      tags: [vehicles]
      operationId: getVehicle
      summary: Read a vehicle by id
      description: |
        Returns one vehicle owned by the caller organization. Another
        organization's id is indistinguishable from an unknown one:
        `404 VEHICLE_NOT_FOUND`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: vehicleId
          in: path
          required: true
          description: Internal vehicle UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vehicle found in the caller organization.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [vehicles]
      operationId: updateVehicle
      summary: Update a vehicle (ADMIN or DISPATCHER)
      description: |
        Partial update of the mutable vehicle fields. At least one field is
        required. The plate, tenant, id and creation time are immutable;
        `updatedAt` is stamped by the server. Omitting `capacityKg` keeps the
        stored value; sending `null` clears it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: vehicleId
          in: path
          required: true
          description: Internal vehicle UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleRequest'
            examples:
              clearCapacity:
                summary: Deactivate and clear the payload
                value:
                  capacityKg: null
                  status: inactive
      responses:
        '200':
          description: Vehicle updated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 access JWT (15 minutes) with `sub`, `organizationId`, `role`,
        `jti`, `iat`, `nbf`, `exp`, `iss` and `aud`. The refresh token is an
        opaque rotating secret in an HttpOnly cookie, never a JWT.
  parameters:
    RequestId:
      name: x-request-id
      in: header
      required: false
      description: |
        Optional correlation id. A value matching `^[A-Za-z0-9._:-]{1,128}$` is
        honored; otherwise the API generates a UUIDv4. The resolved value is
        echoed in the response header and in error bodies.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
      example: dispatcher-request-42
  headers:
    XRequestId:
      description: Correlation id for this request and its logs.
      schema:
        type: string
        format: uuid
    SetRefreshCookie:
      description: |
        Rotating refresh token: `erp_refresh_token=<token>; Path=/api/v1/auth;
        Max-Age=604800; HttpOnly; SameSite=Strict` (plus `Secure` when
        `COOKIE_SECURE=true`). The value is never present in the JSON body.
      schema:
        type: string
      example: erp_refresh_token=opaque-token; Path=/api/v1/auth; Max-Age=604800; HttpOnly; SameSite=Strict
    ClearRefreshCookie:
      description: 'Clears the refresh cookie: `erp_refresh_token=; Max-Age=0` with the same path and flags.'
      schema:
        type: string
      example: erp_refresh_token=; Path=/api/v1/auth; Max-Age=0; HttpOnly; SameSite=Strict
  responses:
    BadRequest:
      description: |
        Invalid input: Zod validation issues (`IDENTITY_INVALID_INPUT`,
        `DELIVERY_ORDER_INVALID_INPUT`, `CUSTOMER_INVALID_INPUT`,
        `DRIVER_INVALID_INPUT` or `VEHICLE_INVALID_INPUT` with `details.issues`),
        a weak password (`IDENTITY_WEAK_PASSWORD` with `details.reasons`), a
        malformed UUID or malformed JSON (`INVALID_JSON`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            identityValidation:
              summary: Identity field-level validation failure
              value:
                error:
                  code: IDENTITY_INVALID_INPUT
                  message: Login request body is invalid
                  details:
                    issues:
                      - path: email
                        message: email must be a valid address
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            weakPassword:
              summary: Password policy rejection
              value:
                error:
                  code: IDENTITY_WEAK_PASSWORD
                  message: Password does not meet the security policy
                  details:
                    reasons: [minimum_length, digit_required]
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            invalidJson:
              summary: Malformed JSON body
              value:
                error:
                  code: INVALID_JSON
                  message: Request body is not valid JSON
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    Unauthorized:
      description: |
        The caller is not authenticated, or a presented credential is not
        usable. Codes: `AUTH_TOKEN_MISSING`, `IDENTITY_INVALID_TOKEN`,
        `AUTH_SESSION_INVALID`, `IDENTITY_INVALID_CREDENTIALS`,
        `AUTH_REFRESH_TOKEN_MISSING`, `IDENTITY_REFRESH_NOT_FOUND` and
        `IDENTITY_REFRESH_REUSE_DETECTED`. Responses never echo the token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missingToken:
              summary: Bearer token absent
              value:
                error:
                  code: AUTH_TOKEN_MISSING
                  message: The Authorization header with a Bearer access token is required
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            invalidCredentials:
              summary: Generic login failure
              value:
                error:
                  code: IDENTITY_INVALID_CREDENTIALS
                  message: Invalid email or password
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            reuseDetected:
              summary: Refresh token replayed
              value:
                error:
                  code: IDENTITY_REFRESH_REUSE_DETECTED
                  message: Refresh token reuse detected; the session family was revoked
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    Forbidden:
      description: |
        The authenticated caller lacks the required role. `details` carries the
        `requiredRoles` and the stored `actualRole`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            dispatcherCannotCreateUser:
              summary: ADMIN required
              value:
                error:
                  code: AUTH_FORBIDDEN
                  message: Role DISPATCHER is not allowed to access this resource
                  details:
                    requiredRoles: [ADMIN]
                    actualRole: DISPATCHER
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    NotFound:
      description: |
        The order does not exist, or it belongs to another organization. Both
        cases return the same body and code (`DELIVERY_ORDER_NOT_FOUND`) so a
        caller cannot confirm existence across tenants.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unknownOrder:
              summary: Unknown order id or public code
              value:
                error:
                  code: DELIVERY_ORDER_NOT_FOUND
                  message: Delivery order 99999999-9999-4999-8999-999999999999 was not found
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    CatalogNotFound:
      description: |
        The customer, driver or vehicle does not exist in the caller
        organization. Another tenant's id returns the same body and code as an
        unknown id (`CUSTOMER_NOT_FOUND`, `DRIVER_NOT_FOUND` or
        `VEHICLE_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unknownCustomer:
              summary: Unknown customer id or another tenant's customer
              value:
                error:
                  code: CUSTOMER_NOT_FOUND
                  message: Customer bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb was not found
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            unknownDriver:
              summary: Unknown driver id or another tenant's driver
              value:
                error:
                  code: DRIVER_NOT_FOUND
                  message: Driver cccccccc-cccc-4ccc-8ccc-cccccccccccc was not found
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            unknownVehicle:
              summary: Unknown vehicle id or another tenant's vehicle
              value:
                error:
                  code: VEHICLE_NOT_FOUND
                  message: Vehicle dddddddd-dddd-4ddd-8ddd-dddddddddddd was not found
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    CatalogConflict:
      description: |
        A catalog identifier is already used in this organization:
        `CUSTOMER_INVARIANT_VIOLATION` (`publicCode`),
        `DRIVER_INVARIANT_VIOLATION` (`documentNumber`) or
        `VEHICLE_INVARIANT_VIOLATION` (`plate`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            duplicateCustomerCode:
              summary: Public code already used in the organization
              value:
                error:
                  code: CUSTOMER_INVARIANT_VIOLATION
                  message: Customer code CUS-2026-0001 is already used in organization 11111111-1111-4111-8111-111111111111
                  details:
                    field: publicCode
                    publicCode: CUS-2026-0001
                    organizationId: 11111111-1111-4111-8111-111111111111
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            duplicateDocument:
              summary: Document number already used in the organization
              value:
                error:
                  code: DRIVER_INVARIANT_VIOLATION
                  message: Driver document DNI-12345678 is already used in organization 11111111-1111-4111-8111-111111111111
                  details:
                    field: documentNumber
                    documentNumber: DNI-12345678
                    organizationId: 11111111-1111-4111-8111-111111111111
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            duplicatePlate:
              summary: Plate already used in the organization
              value:
                error:
                  code: VEHICLE_INVARIANT_VIOLATION
                  message: Vehicle plate ABC-123 is already used in organization 11111111-1111-4111-8111-111111111111
                  details:
                    field: plate
                    plate: ABC-123
                    organizationId: 11111111-1111-4111-8111-111111111111
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    Conflict:
      description: |
        A business invariant was violated. Codes: `IDENTITY_EMAIL_ALREADY_IN_USE`
        or `DELIVERY_ORDER_INVARIANT_VIOLATION`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            emailInUse:
              summary: Email already used in the organization
              value:
                error:
                  code: IDENTITY_EMAIL_ALREADY_IN_USE
                  message: Email is already in use in this organization
                  correlationId: c0ffee00-0000-4000-8000-000000000000
            duplicatePublicCode:
              summary: Public code already used
              value:
                error:
                  code: DELIVERY_ORDER_INVARIANT_VIOLATION
                  message: Public code ORD-2026-0001 is already used in organization 11111111-1111-4111-8111-111111111111
                  details:
                    field: publicCode
                    publicCode: ORD-2026-0001
                    organizationId: 11111111-1111-4111-8111-111111111111
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    TooManyRequests:
      description: |
        The login attempt window for this IP + email is exhausted. `details`
        carries the remaining seconds and the `Retry-After` header matches it.
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
          example: 900
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            rateLimited:
              summary: Login attempts exhausted
              value:
                error:
                  code: AUTH_RATE_LIMITED
                  message: Too many login attempts; try again later
                  details:
                    retryAfterSeconds: 900
                  correlationId: c0ffee00-0000-4000-8000-000000000000
    InternalServerError:
      description: |
        Unexpected failure. The response is generic (`INTERNAL_ERROR`); details are
        logged with the correlation id and never returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unexpected:
              summary: Unhandled failure
              value:
                error:
                  code: INTERNAL_ERROR
                  message: An unexpected error occurred while processing the request
                  correlationId: c0ffee00-0000-4000-8000-000000000000
  schemas:
    UserRole:
      type: string
      enum: [ADMIN, DISPATCHER, DRIVER]
    UserStatus:
      type: string
      enum: [active, disabled]
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, organizationId, email, role]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
    User:
      type: object
      additionalProperties: false
      required: [id, organizationId, email, role, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [organizationId, email, password]
      properties:
        organizationId:
          type: string
          format: uuid
          description: Tenant of the account; emails are unique per organization.
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 200
    AuthSession:
      type: object
      additionalProperties: false
      required: [user, accessToken, accessTokenExpiresAt, refreshTokenExpiresAt]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        accessToken:
          type: string
          description: 'HS256 JWT for the `Authorization: Bearer` header.'
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: The refresh token itself is only sent in the cookie.
    AuthSessionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AuthSession'
    CurrentUserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CurrentUser'
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          description: |
            Temporary password; at least 10 characters with one letter and one
            digit. Rejected with `IDENTITY_WEAK_PASSWORD`.
        role:
          $ref: '#/components/schemas/UserRole'
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    DeliveryOrderStatus:
      type: string
      description: |
        Canonical order statuses (DO-001). The pilot only creates `created` orders;
        transitions arrive with later modules.
      enum: [created, planned, assigned, in_transit, delivered, returned, cancelled]
    Recipient:
      type: object
      additionalProperties: false
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Ana Torres
        phone:
          type: string
          minLength: 6
          maxLength: 20
          pattern: '^\+?[0-9][0-9 ()-]*$'
          description: Digits, spaces, parentheses, hyphens and an optional leading `+`.
          example: '+51 987 654 321'
    DeliveryAddress:
      type: object
      additionalProperties: false
      required: [addressLine, district]
      properties:
        addressLine:
          type: string
          minLength: 5
          maxLength: 200
          example: Av. Javier Prado Este 1234
        district:
          type: string
          minLength: 2
          maxLength: 80
          example: San Borja
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          example: -12.0975
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
          example: -77.0023
      dependentRequired:
        latitude: [longitude]
        longitude: [latitude]
    Package:
      type: object
      additionalProperties: false
      required: [code, description, weightKg]
      description: Response shape; `weightKg` is `null` when it was not supplied.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,39}$'
          example: PKG-001
        description:
          type: string
          minLength: 1
          maxLength: 200
          example: Sealed box
        weightKg:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 1000
          example: 2.5
    CreatePackage:
      type: object
      additionalProperties: false
      required: [code, description]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          description: Letters, digits, hyphens and underscores; normalized to uppercase.
          example: PKG-001
        description:
          type: string
          minLength: 1
          maxLength: 200
          example: Sealed box
        weightKg:
          type: number
          exclusiveMinimum: 0
          maximum: 1000
          example: 2.5
    DeliveryOrder:
      type: object
      required:
        - id
        - organizationId
        - publicCode
        - status
        - recipient
        - deliveryAddress
        - packages
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        publicCode:
          type: string
          example: ORD-2026-0001
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
        recipient:
          $ref: '#/components/schemas/Recipient'
        deliveryAddress:
          allOf:
            - $ref: '#/components/schemas/DeliveryAddress'
          description: Response shape; absent coordinates are `null`.
        packages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Package'
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 instant (UTC `Z`). Render at America/Lima (`-05:00`).
          example: '2026-10-26T20:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 instant (UTC `Z`). Render at America/Lima (`-05:00`).
          example: '2026-10-26T20:00:00.000Z'
    CreateDeliveryOrderRequest:
      type: object
      additionalProperties: false
      required: [publicCode, recipient, deliveryAddress, packages]
      properties:
        publicCode:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$'
          description: Normalized to uppercase and unique per organization.
          example: ORD-2026-0001
        recipient:
          $ref: '#/components/schemas/Recipient'
        deliveryAddress:
          $ref: '#/components/schemas/DeliveryAddress'
        packages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CreatePackage'
    DeliveryOrderResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DeliveryOrder'
    CatalogStatus:
      type: string
      enum: [active, inactive]
    Customer:
      type: object
      additionalProperties: false
      required:
        [id, organizationId, publicCode, name, contactName, contactEmail, contactPhone, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        publicCode:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Z0-9]+(?:-[A-Z0-9]+)*$'
        name:
          type: string
          minLength: 2
          maxLength: 120
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        contactEmail:
          type: string
          format: email
          maxLength: 254
        contactPhone:
          type: string
          minLength: 6
          maxLength: 32
        status:
          $ref: '#/components/schemas/CatalogStatus'
        createdAt:
          type: string
          format: date-time
    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required: [publicCode, name, contactName, contactEmail, contactPhone]
      properties:
        publicCode:
          type: string
          minLength: 3
          maxLength: 32
          description: Trimmed and uppercased; unique per organization.
        name:
          type: string
          minLength: 2
          maxLength: 120
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        contactEmail:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased.
        contactPhone:
          type: string
          minLength: 6
          maxLength: 32
        status:
          $ref: '#/components/schemas/CatalogStatus'
          default: active
    CustomerResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Customer'
    CustomerListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
    Driver:
      type: object
      additionalProperties: false
      required:
        [id, organizationId, fullName, documentNumber, phone, licenseNumber, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        documentNumber:
          type: string
          minLength: 6
          maxLength: 20
          description: Immutable after creation.
        phone:
          type: string
          minLength: 6
          maxLength: 32
        licenseNumber:
          type: string
          minLength: 4
          maxLength: 40
        status:
          $ref: '#/components/schemas/CatalogStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateDriverRequest:
      type: object
      additionalProperties: false
      required: [fullName, documentNumber, phone, licenseNumber]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        documentNumber:
          type: string
          minLength: 6
          maxLength: 20
          description: Trimmed and uppercased; unique per organization.
        phone:
          type: string
          minLength: 6
          maxLength: 32
        licenseNumber:
          type: string
          minLength: 4
          maxLength: 40
        status:
          $ref: '#/components/schemas/CatalogStatus'
          default: active
    UpdateDriverRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        At least one mutable field. `documentNumber` and the tenant are not
        editable; `updatedAt` is stamped by the server.
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 6
          maxLength: 32
        licenseNumber:
          type: string
          minLength: 4
          maxLength: 40
        status:
          $ref: '#/components/schemas/CatalogStatus'
    DriverResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Driver'
    DriverListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Driver'
    Vehicle:
      type: object
      additionalProperties: false
      required:
        [id, organizationId, plate, type, capacityKg, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        plate:
          type: string
          minLength: 3
          maxLength: 16
          pattern: '^[A-Z0-9]+(?:-[A-Z0-9]+)*$'
          description: Immutable after creation.
        type:
          type: string
          minLength: 2
          maxLength: 40
          description: Free text in this milestone.
        capacityKg:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 100000
        status:
          $ref: '#/components/schemas/CatalogStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateVehicleRequest:
      type: object
      additionalProperties: false
      required: [plate, type]
      properties:
        plate:
          type: string
          minLength: 3
          maxLength: 16
          description: Trimmed and uppercased; unique per organization.
        type:
          type: string
          minLength: 2
          maxLength: 40
        capacityKg:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 100000
        status:
          $ref: '#/components/schemas/CatalogStatus'
          default: active
    UpdateVehicleRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        At least one mutable field. The plate and the tenant are not editable.
        Omitting `capacityKg` keeps the stored value; `null` clears it.
      properties:
        type:
          type: string
          minLength: 2
          maxLength: 40
        capacityKg:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 100000
        status:
          $ref: '#/components/schemas/CatalogStatus'
    VehicleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Vehicle'
    VehicleListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
    ValidationIssue:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          description: Dot-separated field path; empty for a body-level issue.
          example: recipient.phone
        message:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: DELIVERY_ORDER_INVALID_INPUT
            message:
              type: string
              description: Human-readable message; never contains raw input or internals.
            details:
              type: object
              additionalProperties: true
              description: |
                Optional structured context. Validation failures carry
                `issues: ValidationIssue[]`; a weak password carries `reasons`;
                a role rejection carries `requiredRoles` and `actualRole`; a
                rate limit carries `retryAfterSeconds`. Never contains request
                bodies or personal data.
            correlationId:
              type: string
              format: uuid
              description: Matches the `x-request-id` response header.
    LivenessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [up, down]
