<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logistics platform — web app coming soon</title>
    <meta
      name="description"
      content="Static placeholder for the last-mile delivery ERP web client, served by nginx."
    />
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1520;
        --panel: #12202f;
        --text: #e9eef4;
        --muted: #9cb0c4;
        --accent: #6ea8d8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(circle at 50% 0%, #16283a 0%, var(--bg) 60%);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      main {
        max-width: 34rem;
        padding: 2.5rem;
        border: 1px solid #22384c;
        border-radius: 1rem;
        background: var(--panel);
        text-align: center;
      }

      .eyebrow {
        margin: 0;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 1rem 0 0.75rem;
        font-size: clamp(1.6rem, 4vw, 2.25rem);
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }

      footer {
        margin-top: 2rem;
        color: #7c93a8;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Logistics platform</p>
      <h1>Web app coming soon</h1>
      <p>
        The dispatcher console, driver view and public tracking are being built.
        This page only confirms that the web container is serving correctly.
      </p>
      <footer>Last-mile delivery ERP — Lima Metropolitana and Callao</footer>
    </main>
  </body>
</html>
